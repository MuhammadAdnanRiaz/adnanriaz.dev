<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Issue tracker with issue list, status dots and a command palette">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141416"/><stop offset="1" stop-color="#0a0a0b"/></linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0" r="0.8"><stop offset="0" stop-color="#f2c14e" stop-opacity="0.18"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#glow)"/>
  <rect x="80" y="70" width="1440" height="860" rx="20" fill="#0f0f11" stroke="#26262b"/>
  <!-- sidebar -->
  <rect x="80" y="70" width="260" height="860" rx="20" fill="#111113"/><rect x="320" y="70" width="20" height="860" fill="#111113"/>
  <text x="112" y="122" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#f3f1ec" font-weight="700">acme-eng</text><text x="112" y="144" font-family="Menlo, monospace" font-size="12" fill="#6e6b65">workspace · 8 members</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#a7a39b">
    <rect x="100" y="180" width="220" height="36" rx="8" fill="#f2c14e" fill-opacity="0.12"/><text x="116" y="204" fill="#f3f1ec">My issues</text>
    <text x="116" y="248">Inbox</text><text x="116" y="288">Cycles</text><text x="116" y="328">Projects</text><text x="116" y="368">Members</text>
    <text x="116" y="430" font-family="Menlo, monospace" font-size="11" fill="#6e6b65">PROJECTS</text>
    <text x="116" y="466">Billing v2</text><text x="116" y="502">Mobile launch</text><text x="116" y="538">Realtime</text>
  </g>
