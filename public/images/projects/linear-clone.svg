  <!-- issue rows -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="16">
    <g transform="translate(0 0)"><line x1="360" y1="190" x2="1500" y2="190" stroke="#1c1c20"/><text x="380" y="222" font-family="Menlo, monospace" font-size="12" fill="#6e6b65">ENG-241</text><circle cx="470" cy="216" r="6" fill="none" stroke="#f2c14e" stroke-width="2"/><text x="492" y="222" fill="#f3f1ec">Webhook retries drop events after 3rd attempt</text><rect x="1240" y="204" width="70" height="22" rx="11" fill="#26262b"/><text x="1275" y="220" font-size="11" fill="#a7a39b" text-anchor="middle">urgent</text><circle cx="1460" cy="216" r="12" fill="#3a3a40"/></g>
    <g transform="translate(0 52)"><line x1="360" y1="190" x2="1500" y2="190" stroke="#1c1c20"/><text x="380" y="222" font-family="Menlo, monospace" font-size="12" fill="#6e6b65">ENG-238</text><circle cx="470" cy="216" r="6" fill="#f2c14e"/><text x="492" y="222" fill="#f3f1ec">Optimistic update rollback on 409 conflict</text><rect x="1240" y="204" width="90" height="22" rx="11" fill="#26262b"/><text x="1285" y="220" font-size="11" fill="#a7a39b" text-anchor="middle">in progress</text><circle cx="1460" cy="216" r="12" fill="#f2c14e"/></g>
    <g transform="translate(0 104)"><line x1="360" y1="190" x2="1500" y2="190" stroke="#1c1c20"/><text x="380" y="222" font-family="Menlo, monospace" font-size="12" fill="#6e6b65">ENG-236</text><circle cx="470" cy="216" r="6" fill="#7fd8a4"/><text x="492" y="222" fill="#a7a39b">Tenant scope check on /api/issues/:id</text><rect x="1240" y="204" width="60" height="22" rx="11" fill="#26262b"/><text x="1270" y="220" font-size="11" fill="#a7a39b" text-anchor="middle">done</text><circle cx="1460" cy="216" r="12" fill="#3a3a40"/></g>
    <g transform="translate(0 156)"><line x1="360" y1="190" x2="1500" y2="190" stroke="#1c1c20"/><text x="380" y="222" font-family="Menlo, monospace" font-size="12" fill="#6e6b65">ENG-233</text><circle cx="470" cy="216" r="6" fill="none" stroke="#6e6b65" stroke-width="2"/><text x="492" y="222" fill="#f3f1ec">Command palette: assignee:me filter</text><rect x="1240" y="204" width="70" height="22" rx="11" fill="#26262b"/><text x="1275" y="220" font-size="11" fill="#a7a39b" text-anchor="middle">todo</text><circle cx="1460" cy="216" r="12" fill="#3a3a40"/></g>
    <g transform="translate(0 208)"><line x1="360" y1="190" x2="1500" y2="190" stroke="#1c1c20"/><text x="380" y="222" font-family="Menlo, monospace" font-size="12" fill="#6e6b65">ENG-229</text><circle cx="470" cy="216" r="6" fill="#7fd8a4"/><text x="492" y="222" fill="#a7a39b">Derive cycle status from dates</text><rect x="1240" y="204" width="60" height="22" rx="11" fill="#26262b"/><text x="1270" y="220" font-size="11" fill="#a7a39b" text-anchor="middle">done</text><circle cx="1460" cy="216" r="12" fill="#3a3a40"/></g>
    <g transform="translate(0 260)"><line x1="360" y1="190" x2="1500" y2="190" stroke="#1c1c20"/><text x="380" y="222" font-family="Menlo, monospace" font-size="12" fill="#6e6b65">ENG-225</text><circle cx="470" cy="216" r="6" fill="#f2c14e"/><text x="492" y="222" fill="#f3f1ec">Pusher private channel auth per team</text><rect x="1240" y="204" width="90" height="22" rx="11" fill="#26262b"/><text x="1285" y="220" font-size="11" fill="#a7a39b" text-anchor="middle">in progress</text><circle cx="1460" cy="216" r="12" fill="#3a3a40"/></g>
    <line x1="360" y1="502" x2="1500" y2="502" stroke="#1c1c20"/>
  </g>
  <!-- command palette overlay -->
  <rect x="80" y="70" width="1440" height="860" rx="20" fill="#000" fill-opacity="0.35"/>
  <rect x="470" y="560" width="660" height="300" rx="16" fill="#131316" stroke="#34343a"/>
  <rect x="470" y="560" width="660" height="60" rx="16" fill="#18181b"/><rect x="470" y="600" width="660" height="20" fill="#18181b"/>
  <text x="498" y="598" font-family="Menlo, monospace" font-size="18" fill="#f3f1ec">status:in_progress assignee:me<tspan fill="#f2c14e">|</tspan></text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15">
    <rect x="482" y="636" width="636" height="44" rx="10" fill="#f2c14e" fill-opacity="0.12"/><circle cx="506" cy="658" r="5" fill="#f2c14e"/><text x="524" y="663" fill="#f3f1ec">ENG-238 · Optimistic update rollback on 409 conflict</text>
    <circle cx="506" cy="710" r="5" fill="#f2c14e"/><text x="524" y="715" fill="#a7a39b">ENG-225 · Pusher private channel auth per team</text>
    <circle cx="506" cy="762" r="5" fill="#f2c14e"/><text x="524" y="767" fill="#a7a39b">ENG-219 · Board view drag ordering</text>
    <text x="498" y="838" font-family="Menlo, monospace" font-size="12" fill="#6e6b65">↑↓ navigate · ↵ open · esc close</text>
