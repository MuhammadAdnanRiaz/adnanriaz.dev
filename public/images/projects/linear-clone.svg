  <text x="380" y="126" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f3f1ec" font-weight="700">Active cycle · 14</text>
  <text x="380" y="150" font-family="Menlo, monospace" font-size="12" fill="#6e6b65">Sep 8 – Sep 21 · 63% complete</text>
