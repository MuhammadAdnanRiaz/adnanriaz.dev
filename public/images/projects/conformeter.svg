<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Compliance dashboard with requirements checklist, pass-fail chart and admin sidebar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141416"/><stop offset="1" stop-color="#0a0a0b"/></linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.9" r="0.7"><stop offset="0" stop-color="#f2c14e" stop-opacity="0.2"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#glow)"/>
  <rect x="80" y="70" width="1440" height="860" rx="20" fill="#0f0f11" stroke="#26262b"/>
  <rect x="80" y="70" width="240" height="860" rx="20" fill="#111113"/><rect x="300" y="70" width="20" height="860" fill="#111113"/>
  <text x="112" y="124" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#f3f1ec" font-weight="700">Conformeter</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#a7a39b">
    <rect x="100" y="170" width="200" height="36" rx="8" fill="#f2c14e" fill-opacity="0.12"/><text x="116" y="194" fill="#f3f1ec">Compliance</text>
    <text x="116" y="238">Upload evidence</text><text x="116" y="278">Documents</text><text x="116" y="318">Standards</text><text x="116" y="358">Organisation</text><text x="116" y="398">Billing</text>
  </g>
  <text x="360" y="130" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#f3f1ec" font-weight="700">PCI DSS v4.0 · Requirements</text>
  <text x="360" y="156" font-family="Menlo, monospace" font-size="12" fill="#6e6b65">Acme Payments Ltd · last evaluated today</text>
  <!-- KPI row -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="360" y="184" width="270" height="110" rx="14" fill="#131316" stroke="#222226"/><text x="384" y="214" font-family="Menlo, monospace" font-size="12" fill="#8a877f">PASSED</text><text x="384" y="268" font-size="44" fill="#7fd8a4" font-weight="700">184</text>
    <rect x="650" y="184" width="270" height="110" rx="14" fill="#131316" stroke="#222226"/><text x="674" y="214" font-family="Menlo, monospace" font-size="12" fill="#8a877f">FAILED</text><text x="674" y="268" font-size="44" fill="#ff8a80" font-weight="700">23</text>
    <rect x="940" y="184" width="270" height="110" rx="14" fill="#131316" stroke="#222226"/><text x="964" y="214" font-family="Menlo, monospace" font-size="12" fill="#8a877f">MISSING EVIDENCE</text><text x="964" y="268" font-size="44" fill="#f2c14e" font-weight="700">41</text>
    <rect x="1230" y="184" width="260" height="110" rx="14" fill="#f2c14e"/><text x="1254" y="220" font-size="14" fill="#1c1400" font-weight="700">UNLOCK STANDARD</text><text x="1254" y="260" font-size="20" fill="#1c1400" font-weight="700">ISO 27001 →</text>
  </g>
  <!-- checklist -->
  <rect x="360" y="322" width="720" height="574" rx="14" fill="#131316" stroke="#222226"/>
  <text x="384" y="356" font-family="Menlo, monospace" font-size="12" fill="#8a877f">REQUIREMENT 3 · PROTECT STORED ACCOUNT DATA</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15">
    <g transform="translate(0 0)"><line x1="384" y1="380" x2="1056" y2="380" stroke="#1c1c20"/><circle cx="400" cy="408" r="8" fill="#7fd8a4"/><text x="424" y="413" fill="#f3f1ec">3.1  Processes for protecting stored account data are defined</text></g>
    <g transform="translate(0 56)"><line x1="384" y1="380" x2="1056" y2="380" stroke="#1c1c20"/><circle cx="400" cy="408" r="8" fill="#7fd8a4"/><text x="424" y="413" fill="#f3f1ec">3.2  Storage of account data is kept to a minimum</text></g>
    <g transform="translate(0 112)"><line x1="384" y1="380" x2="1056" y2="380" stroke="#1c1c20"/><circle cx="400" cy="408" r="8" fill="#ff8a80"/><text x="424" y="413" fill="#f3f1ec">3.3  Sensitive authentication data is not retained</text><rect x="930" y="396" width="110" height="24" rx="12" fill="#ff8a80" fill-opacity="0.18"/><text x="985" y="413" font-size="11" fill="#ff8a80" text-anchor="middle">FAILED</text></g>
    <g transform="translate(0 168)"><line x1="384" y1="380" x2="1056" y2="380" stroke="#1c1c20"/><circle cx="400" cy="408" r="8" fill="#7fd8a4"/><text x="424" y="413" fill="#f3f1ec">3.4  PAN is masked when displayed</text></g>
    <g transform="translate(0 224)"><line x1="384" y1="380" x2="1056" y2="380" stroke="#1c1c20"/><circle cx="400" cy="408" r="8" fill="none" stroke="#f2c14e" stroke-width="2"/><text x="424" y="413" fill="#a7a39b">3.5  PAN is rendered unreadable anywhere it is stored</text><rect x="900" y="396" width="140" height="24" rx="12" fill="#f2c14e" fill-opacity="0.18"/><text x="970" y="413" font-size="11" fill="#f2c14e" text-anchor="middle">UPLOAD EVIDENCE</text></g>
    <g transform="translate(0 280)"><line x1="384" y1="380" x2="1056" y2="380" stroke="#1c1c20"/><circle cx="400" cy="408" r="8" fill="#7fd8a4"/><text x="424" y="413" fill="#f3f1ec">3.6  Cryptographic keys are protected</text></g>
    <g transform="translate(0 336)"><line x1="384" y1="380" x2="1056" y2="380" stroke="#1c1c20"/><circle cx="400" cy="408" r="8" fill="#7fd8a4"/><text x="424" y="413" fill="#f3f1ec">3.7  Key management processes are defined</text></g>
    <g transform="translate(0 392)"><line x1="384" y1="380" x2="1056" y2="380" stroke="#1c1c20"/><circle cx="400" cy="408" r="8" fill="#7fd8a4"/><text x="424" y="413" fill="#f3f1ec">3.8  Evidence: key-rotation-policy.pdf, hsm-config.png</text></g>
    <line x1="384" y1="828" x2="1056" y2="828" stroke="#1c1c20"/>
  </g>
  <!-- bar chart -->
  <rect x="1100" y="322" width="390" height="574" rx="14" fill="#131316" stroke="#222226"/>
  <text x="1124" y="356" font-family="Menlo, monospace" font-size="12" fill="#8a877f">DOCUMENT COMPLIANCE BY REQUIREMENT</text>
  <g>
    <rect x="1130" y="700" width="34" height="160" rx="4" fill="#7fd8a4"/><rect x="1176" y="740" width="34" height="120" rx="4" fill="#7fd8a4"/><rect x="1222" y="640" width="34" height="220" rx="4" fill="#7fd8a4"/><rect x="1268" y="780" width="34" height="80" rx="4" fill="#ff8a80"/><rect x="1314" y="690" width="34" height="170" rx="4" fill="#7fd8a4"/><rect x="1360" y="760" width="34" height="100" rx="4" fill="#f2c14e"/><rect x="1406" y="660" width="34" height="200" rx="4" fill="#7fd8a4"/><rect x="1452" y="720" width="34" height="140" rx="4" fill="#7fd8a4"/>
    <line x1="1124" y1="860" x2="1470" y2="860" stroke="#34343a"/>
    <g font-family="Menlo, monospace" font-size="11" fill="#6e6b65"><text x="1147" y="880" text-anchor="middle">R1</text><text x="1193" y="880" text-anchor="middle">R2</text><text x="1239" y="880" text-anchor="middle">R3</text><text x="1285" y="880" text-anchor="middle">R4</text><text x="1331" y="880" text-anchor="middle">R5</text><text x="1377" y="880" text-anchor="middle">R6</text><text x="1423" y="880" text-anchor="middle">R7</text><text x="1469" y="880" text-anchor="middle">R8</text></g>
  </g>
</svg>
