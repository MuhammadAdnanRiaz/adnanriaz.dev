<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Profile cards being matched for a scheduled call, with a calendar invite and an email notification">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141416"/><stop offset="1" stop-color="#0a0a0b"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#f2c14e" stop-opacity="0.16"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)"/><rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- connection line -->
  <path d="M 470 500 C 620 500, 640 500, 800 500 S 980 500, 1130 500" fill="none" stroke="#f2c14e" stroke-width="3" stroke-dasharray="10 10"/>
  <circle cx="800" cy="500" r="54" fill="#0f0f11" stroke="#f2c14e" stroke-width="3"/>
  <text x="800" y="492" font-family="Menlo, monospace" font-size="13" fill="#f2c14e" text-anchor="middle">MATCH 94%</text>
  <text x="800" y="514" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#f3f1ec" text-anchor="middle" font-weight="700">Tue 09:00</text>
  <!-- left profile card -->
  <g transform="translate(150 330)">
    <rect x="0" y="0" width="320" height="340" rx="18" fill="#131316" stroke="#26262b"/>
    <circle cx="160" cy="90" r="48" fill="#26262b"/><circle cx="160" cy="76" r="18" fill="#3a3a40"/><path d="M118 132 Q160 96 202 132 Z" fill="#3a3a40"/>
    <text x="160" y="170" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#f3f1ec" font-weight="700" text-anchor="middle">Margaret H.</text>
    <text x="160" y="194" font-family="Menlo, monospace" font-size="12" fill="#a7a39b" text-anchor="middle">Mentee · Product · GMT-5</text>
    <rect x="40" y="222" width="240" height="1" fill="#26262b"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#a7a39b"><text x="40" y="254">Goals</text><text x="40" y="280" fill="#f3f1ec">Leadership · Public speaking</text><text x="40" y="312">Availability</text></g>
    <g fill="#f2c14e" fill-opacity="0.25"><rect x="140" y="300" width="22" height="16" rx="4"/><rect x="166" y="300" width="22" height="16" rx="4"/><rect x="218" y="300" width="22" height="16" rx="4"/></g>
    <g fill="#26262b"><rect x="192" y="300" width="22" height="16" rx="4"/><rect x="244" y="300" width="22" height="16" rx="4"/></g>
  </g>
  <!-- right profile card -->
  <g transform="translate(1130 330)">
    <rect x="0" y="0" width="320" height="340" rx="18" fill="#131316" stroke="#26262b"/>
    <circle cx="160" cy="90" r="48" fill="#26262b"/><circle cx="160" cy="76" r="18" fill="#3a3a40"/><path d="M118 132 Q160 96 202 132 Z" fill="#3a3a40"/>
    <text x="160" y="170" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#f3f1ec" font-weight="700" text-anchor="middle">Daniel O.</text>
    <text x="160" y="194" font-family="Menlo, monospace" font-size="12" fill="#a7a39b" text-anchor="middle">Mentor · VP Engineering · GMT+1</text>
    <rect x="40" y="222" width="240" height="1" fill="#26262b"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#a7a39b"><text x="40" y="254">Expertise</text><text x="40" y="280" fill="#f3f1ec">Leadership · Hiring · Public speaking</text><text x="40" y="312">Availability</text></g>
    <g fill="#f2c14e" fill-opacity="0.25"><rect x="140" y="300" width="22" height="16" rx="4"/><rect x="218" y="300" width="22" height="16" rx="4"/><rect x="244" y="300" width="22" height="16" rx="4"/></g>
    <g fill="#26262b"><rect x="166" y="300" width="22" height="16" rx="4"/><rect x="192" y="300" width="22" height="16" rx="4"/></g>
  </g>
  <!-- calendar invite -->
  <g transform="translate(560 120)">
    <rect x="0" y="0" width="480" height="150" rx="16" fill="#131316" stroke="#34343a"/>
    <rect x="24" y="28" width="72" height="72" rx="10" fill="#f2c14e"/><text x="60" y="56" font-family="Menlo, monospace" font-size="12" fill="#1c1400" text-anchor="middle">SEP</text><text x="60" y="88" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1c1400" text-anchor="middle" font-weight="700">22</text>
    <text x="120" y="52" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#f3f1ec" font-weight="700">Mentoring session: Margaret &amp; Daniel</text>
    <text x="120" y="78" font-family="Menlo, monospace" font-size="13" fill="#a7a39b">09:00 New York · 15:00 Brussels · 30 min</text>
    <text x="120" y="104" font-family="Menlo, monospace" font-size="12" fill="#7fd8a4">✓ invite.ics sent · Google Calendar synced</text>
    <text x="24" y="132" font-family="Menlo, monospace" font-size="11" fill="#6e6b65">source: mentorship program · Acme Corp · session 3 of 6</text>
  </g>
  <!-- email log -->
  <g transform="translate(560 730)">
    <rect x="0" y="0" width="480" height="150" rx="16" fill="#131316" stroke="#34343a"/>
    <text x="24" y="34" font-family="Menlo, monospace" font-size="12" fill="#8a877f">EMAIL LOG</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="14">
      <circle cx="34" cy="66" r="5" fill="#7fd8a4"/><text x="52" y="71" fill="#f3f1ec">Reminder · Margaret H.</text><text x="456" y="71" font-family="Menlo, monospace" font-size="12" fill="#a7a39b" text-anchor="end">delivered 08:00</text>
      <circle cx="34" cy="98" r="5" fill="#7fd8a4"/><text x="52" y="103" fill="#f3f1ec">Reminder · Daniel O.</text><text x="456" y="103" font-family="Menlo, monospace" font-size="12" fill="#a7a39b" text-anchor="end">delivered 14:00</text>
      <circle cx="34" cy="130" r="5" fill="#f2c14e"/><text x="52" y="135" fill="#a7a39b">Nudge: quiet pair · admin</text><text x="456" y="135" font-family="Menlo, monospace" font-size="12" fill="#a7a39b" text-anchor="end">scheduled</text>
    </g>
  </g>
</svg>
